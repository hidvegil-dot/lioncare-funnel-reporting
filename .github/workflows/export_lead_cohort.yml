name: Export Lead Cohort

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Cohort start date in YYYY-MM-DD format."
        required: true
        type: string
      end_date:
        description: "Cohort end date in YYYY-MM-DD format."
        required: true
        type: string

jobs:
  export-lead-cohort:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Budapest
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
      GHL_PRIVATE_INTEGRATION_TOKEN: ${{ secrets.GHL_PRIVATE_INTEGRATION_TOKEN }}
      GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
      GHL_BASE_URL: ${{ secrets.GHL_BASE_URL }}
      GHL_API_VERSION: ${{ secrets.GHL_API_VERSION }}
      REPORT_DATA_STRICT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate GHL secrets
        run: |
          missing=0
          for name in GHL_LOCATION_ID GHL_BASE_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing GitHub secret::$name is empty or not configured"
              missing=1
            fi
          done
          if [ -z "${GHL_PRIVATE_INTEGRATION_TOKEN:-}" ] && [ -z "${GHL_API_KEY:-}" ]; then
            echo "::error title=Missing GitHub secret::GHL_PRIVATE_INTEGRATION_TOKEN or GHL_API_KEY is required"
            missing=1
          fi
          exit "$missing"
      - name: Export lead cohort CSV
        run: |
          mkdir -p out
          python scripts/export_lead_cohort.py \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --output out/lead_cohort_${{ inputs.start_date }}_to_${{ inputs.end_date }}.csv
      - name: Upload lead cohort artifact
        uses: actions/upload-artifact@v4
        with:
          name: lead-cohort-${{ inputs.start_date }}-to-${{ inputs.end_date }}
          if-no-files-found: error
          path: out/lead_cohort_*.csv
